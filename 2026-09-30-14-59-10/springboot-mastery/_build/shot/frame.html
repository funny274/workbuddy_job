<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8">
<style>html,body{margin:0;padding:0;overflow:hidden}#f{width:1440px;height:1200px;border:0;display:block}</style>
</head>
<body>
<iframe id="f" src="index.html"></iframe>
<script>
  // 等 iframe 内脚本渲染完成后滚动到代码块区域
  document.getElementById('f').addEventListener('load', function(){
    setTimeout(function(){
      try{
        var d = document.getElementById('f').contentDocument;
        var pre = d.querySelector('pre.hl');
        if(pre){ pre.scrollIntoView({block:'start'}); d.documentElement.scrollTop = pre.getBoundingClientRect().top + d.documentElement.scrollTop - 120; }
      }catch(e){ document.title = 'ERR:'+e.message; }
    }, 1500);
  });
</script>
</body>
</html>
